name: Reffi
options:
  bundleIdPrefix: com.heejae
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Reffi:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Reffi
    info:
      path: Reffi-Info.plist
      properties:
        CFBundleDisplayName: Reffi
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - StoryScript-Regular.ttf
          - GoogleSansFlex-400.ttf
          - GoogleSansFlex-500.ttf
          - GoogleSansFlex-600.ttf
          - GoogleSansFlex-700.ttf
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.heejae.reffi
        PRODUCT_NAME: Reffi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
