name: Reffi
options:
  bundleIdPrefix: com.reffi
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  PhosphorSwift:
    url: https://github.com/phosphor-icons/swift
    from: 2.1.0
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

schemes:
  Reffi:
    build:
      targets:
        Reffi: all
        ReffiTests: [test]
        ReffiUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [ReffiTests, ReffiUITests]

targets:
  Reffi:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Reffi
        excludes:
          - "Info.plist"
    dependencies:
      - package: PhosphorSwift
        product: PhosphorSwift
      - package: Supabase
        product: Supabase
    info:
      path: Reffi/Info.plist
      properties:
        CFBundleDisplayName: Reffi
        CFBundleName: Reffi
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Reffi uses the camera to scan grocery receipts so items are added automatically."
        NSMotionUsageDescription: "Reffi tilts the ingredients on your counter with your device's motion."
        CFBundleURLTypes:
          - CFBundleURLName: com.reffi.app.auth
            CFBundleURLSchemes:
              - reffi
        UIAppFonts:
          - Pretendard-Regular.otf
          - Pretendard-Medium.otf
          - Pretendard-SemiBold.otf
          - Pretendard-Bold.otf
          - GoogleSansFlex-Regular.ttf
          - StoryScript-Regular.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reffi.app
        # Sign in with Apple — 시뮬레이터(서명 없음)에선 무시되고, 실기기/배포 서명 시 임베드된다.
        CODE_SIGN_ENTITLEMENTS: Reffi/Reffi.entitlements
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"

  ReffiTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources: [ReffiTests]
    dependencies:
      - target: Reffi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Reffi.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)Reffi"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"

  ReffiUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: ReffiUITests
    dependencies:
      - target: Reffi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.reffi.app.uitests
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: Reffi
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
